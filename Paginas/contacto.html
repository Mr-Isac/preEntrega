<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/scss/main.css" />
    <title>Contactos</title>
  </head>
  <body>
    <!-- PEGAMOS TANTO EL FOOTER COMO EL HEADER EN LAS TRES PAGINAS, PUES AUN NO PODEMOS USAR JS NI REACT  -->
    <header
      class="navbar navbar-dark d-flex justify-content-between align-items-center px-3 py-2"
    >
      <!-- Logo -->
      <a href="../index.html">
        <img
          class="logo"
          src="../assets/logo.png"
          alt="Logo de Isaac Mendoza"
        />
      </a>

      <!-- Botón hamburguesa (visible hasta tablet) -->
      <button
        class="navbar-toggler d-lg-none custom-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
        aria-controls="menu"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Menú -->
      <nav class="collapse d-lg-block" id="menu">
        <ul class="d-flex flex-column flex-lg-row mb-0">
          <li><a href="../index.html">HOME</a></li>
          <li><a href="./proyectos.html">PROYECTOS</a></li>
          <li><a href="./contacto.html">CONTACTO</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contacto">
        <h1>CONTACTO</h1>
        <p>
          Contactame si deseas trabajar conmigo o escribir una reseña sobre mis
          servicios
        </p>
        <form action="#" method="POST">
          <input
            type="text"
            name="nombre"
            placeholder="Nombres"
            required
          /><br /><br />
          <input
            type="email"
            name="correo"
            placeholder="Tu correo"
            required
          /><br /><br />
          <input
            type="tel"
            name="telefono"
            placeholder="Tu número de teléfono"
          /><br /><br />
          <textarea
            name="mensaje"
            rows="5"
            placeholder="Escribe tu mensaje aquí..."
            required
          ></textarea
          ><br /><br />
          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>
    <footer>
      <p>
        Desarrollador web en formación, creando proyectos limpios y funcionales.
      </p>
      <p>Todos los derechos reservados © 2025 Desarrollo por Isaac</p>
    </footer>
    <!-- Bootstrap  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
